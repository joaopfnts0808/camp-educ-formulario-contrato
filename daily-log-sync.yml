name: Sync logs Cativa -> Google Sheets

on:
  schedule:
    # 12:00 no horario de Brasilia (UTC-3) = 15:00 UTC
    - cron: "0 15 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions do GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar o robo
        env:
          CATIVA_EMAIL: ${{ secrets.CATIVA_EMAIL }}
          CATIVA_PASSWORD: ${{ secrets.CATIVA_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          HEADLESS: "true"
        run: python scrape_cativa_logs.py

      - name: Salvar screenshots de debug (se der erro)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          if-no-files-found: ignore
